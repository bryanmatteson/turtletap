[package]
    authors      = ["Bryan Matteson <7145232+bryanmatteson@users.noreply.github.com>"]
    autobins     = false
    categories   = ["command-line-interface"]
    description  = "Tap into persistent, session-like surfaces from any terminal"
    edition      = "2024"
    exclude      = [".github/**", ".gitignore", "mise.toml"]
    keywords     = ["terminal", "tui", "shell", "session", "ratatui"]
    license      = "MIT"
    name         = "turtletap"
    readme       = "README.md"
    repository   = "https://github.com/bryanmatteson/turtletap"
    rust-version = "1.88"
    version      = "0.1.0"

[dependencies]
    async-channel = "2"
    crc32fast     = "1"
    crossterm     = "0.29"
    fs2           = "0.4"
    kdl           = "4.7"
    ratatui       = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
    semver        = "1"
    serde         = { version = "1", features = ["derive"] }
    serde_json    = { version = "1", features = ["raw_value"] }
    tokio         = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
    toml          = "1.1"
    uuid          = { version = "1", features = ["serde", "v4"] }

[lints.rust]
    missing_docs = "warn"
    unsafe_code  = "forbid"

[lints.clippy]
    dbg_macro   = "deny"
    todo        = "deny"
    unwrap_used = "deny"

[[bin]]
    name = "turtletap"
    path = "src/bin/main.rs"
