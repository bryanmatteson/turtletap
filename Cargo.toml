[package]
    autobins      = false
    authors      = ["Bryan Matteson"]
    categories   = ["command-line-interface"]
    description  = "Tap into persistent, session-like surfaces from any terminal"
    edition      = "2024"
    keywords     = ["terminal", "tui", "shell", "session", "ratatui"]
    license      = "MIT"
    name         = "turtletap"
    readme       = "README.md"
    repository   = "https://github.com/bryanmatteson/turtletap"
    rust-version = "1.88"
    version      = "0.1.0"

[dependencies]
    async-channel = "2"
    crossterm = "0.29"
    crc32fast = "1"
    fs2       = "0.4"
    ratatui   = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
    serde     = { version = "1", features = ["derive"] }
    serde_json = "1"
    semver     = "1"
    tokio     = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
    uuid      = { version = "1", features = ["serde", "v4"] }

[lints.rust]
    missing_docs = "warn"
    unsafe_code  = "forbid"

[lints.clippy]
    dbg_macro   = "deny"
    todo        = "deny"
    unwrap_used = "deny"

[[bin]]
    name = "turtletap"
    path = "src/bin/main.rs"
